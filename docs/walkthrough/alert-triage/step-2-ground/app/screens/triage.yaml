title: Triage an alert
description: Paste a security alert and attach its logs. The app reads both, checks the team's runbooks and gives a verdict with next steps.
layout: review
model: smart
inputs:
  - {name: alert, type: textarea, label: Paste the alert, placeholder: "Alert text from the SIEM, firewall or a user report"}
  - {name: logs, type: file, label: Attach the logs, accept: ".log,.txt,.csv", optional: true}
  - {name: asset, type: select, label: Affected system, options: data/assets.csv, optional: true}
knowledge: knowledge/
output: json
answer:
  - text: {key: verdict, title: Verdict}
  - checklist: {key: steps, title: Next steps}
examples:
  - label: Password spray, then a login
    inputs:
      alert: "212 failed VPN logins for 9 users from 203.0.113.45, then a success for j.ortiz at 02:14"
      logs: data/vpn-spray.log
      asset: vpn-gw-01
    mock:
      verdict: >-
        Very likely a password spray that succeeded. 203.0.113.45 failed 212 times across 9 accounts
        between 01:52 and 02:12, then j.ortiz logged in from the same address at 02:14:07 with
        "mfa=none reason=legacy_client" and opened a connection to fin-db-02 at 02:16:31.
      steps:
        - {step: "Block 203.0.113.45 at the VPN gateway and the firewall edge", source: "[2]"}
        - {step: "Disable j.ortiz's VPN session and force a password reset", source: "[2]"}
        - {step: "Turn off the legacy VPN client that skipped multi-factor authentication", source: "[2]"}
        - {step: "Pull j.ortiz's session log and check what it read from fin-db-02", source: "[4]"}
        - {step: "Check the other 8 accounts for sign-ins from other addresses in the last 7 days", source: "[4]"}
  - label: Reported phishing email
    inputs:
      alert: "m.reyes reported an email from payroll-update@examp1e-hr.example asking staff to confirm bank details through a link"
      asset: mail-01
    mock:
      verdict: >-
        Likely a credential-phishing email. The sender domain imitates the company's HR domain with
        a digit 1 in place of the letter l, and the request to confirm bank details through a link is
        a common payroll-diversion lure. No logs were attached, so it is not yet known who clicked.
      steps:
        - {step: "Purge every copy of the email from mailboxes by sender and subject", source: "[3]"}
        - {step: "Block examp1e-hr.example and the link's domain at the mail relay and web proxy", source: "[3]"}
        - {step: "Search the web proxy log for anyone who opened the link", source: "[4]"}
        - {step: "Ask m.reyes whether they replied or entered anything", source: "[4]"}
        - {step: "Reset the password and revoke sessions of anyone who entered credentials", source: "[2]"}
